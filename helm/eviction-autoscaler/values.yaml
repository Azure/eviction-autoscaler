# =============================================================================
# USER CONFIGURATION - Main settings users typically need to customize
# =============================================================================

# Container image configuration
image:
  repository: paulgmiller/k8s-pdb-autoscaler
  tag: latest
  pullPolicy: IfNotPresent

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Controller pod scheduling
# nodeSelector pins the controller to nodes matching these labels (node affinity
# by label). affinity accepts a full Kubernetes affinity spec (nodeAffinity,
# podAffinity, podAntiAffinity). tolerations allow scheduling onto tainted nodes.
# Example:
#   nodeSelector:
#     kubernetes.io/os: linux
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: agentpool
#                 operator: In
#                 values: ["system"]
nodeSelector: {}
affinity: {}
tolerations: []

# Controller configuration - the main settings users need to customize
controllerConfig:
  # Global enable/disable for the entire controller (kill switch).
  # - true (default): reconcilers run normally.
  # - false: no reconcilers are registered, so the controller takes no action on any
  #          namespace or PDB (it still serves health and metrics). Use this to fully
  #          disable eviction-autoscaler in place, without uninstalling the extension.
  enabled: true

  # Metrics configuration
  metrics:
    enabled: true
  
  # Namespace watching configuration
  namespaces:
    
    # Default enable behavior for namespaces
    # - false (default, opt-in mode): All namespaces are disabled by default.
    #                                  Only namespaces in actionedNamespaces are enabled.
    #                                  Other namespaces can opt-in with annotation "eviction-autoscaler.azure.com/enable=true"
    # - true (opt-out mode): All namespaces are enabled by default.
    #                        actionedNamespaces is ignored.
    #                        Namespaces can opt-out with annotation "eviction-autoscaler.azure.com/enable=false"
    # Note: Annotations take precedence over these settings, EXCEPT for AKS-owned
    # namespaces (kube-system, flux-system, etc.), which eviction-autoscaler always
    # manages and which ignore both this configuration and the annotation.
    enabledByDefault: false
    
    # Namespaces to action on (behavior depends on enabledByDefault)
    # When enabledByDefault=false (opt-in): These namespaces are enabled, all others disabled
    # When enabledByDefault=true (opt-out): This list is ignored, all namespaces enabled by default
    # Only customer namespaces belong here. AKS-owned namespaces (kube-system, etc.)
    # are always managed automatically and must NOT be listed (doing so fails startup).
    # Default: [] (no customer namespaces actioned)
    # Upgrade note: if upgrading from an older chart that defaulted to [kube-system],
    # remove it from your values (or use `helm upgrade --reset-values`), otherwise startup fails.
    actionedNamespaces: []
  
  # PDB creation configuration
  pdb:
    create: true

  # Zero-maxSurge drain override (fleet-wide, install-time)
  # When a workload's rollout maxSurge resolves to 0 — an explicit maxSurge: 0, a
  # Recreate strategy, or an unset RollingUpdate — the controller normally cannot
  # surge and degrades during a drain. Set this to let it surge such workloads
  # anyway. The value is an int-or-percentage, mirroring Kubernetes maxSurge:
  #   "25%" — 25% of the workload's min replicas (rounded up), or
  #   "10"  — an absolute number of extra pods.
  # A value that resolves to zero ("0"/"0%") or an empty string leaves the feature
  # off (default), preserving today's degrade-on-zero behavior. Workloads with a
  # non-zero maxSurge are never affected.
  zeroSurgeOverride: ""



# ServiceAccount annotations (for cloud integrations like IRSA, Workload Identity)
serviceAccount:
  annotations: {}

# =============================================================================
# INTERNAL CONFIGURATION - Fixed settings with sensible defaults
# These are not intended for user customization
# =============================================================================

# Deployment configuration (fixed)
replicaCount: 1

# PodDisruptionBudget for the controller itself
pdb:
  enabled: true
  minAvailable: 1

# Security contexts (fixed for security)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Health checks (fixed)
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Port configuration (fixed)
ports:
  metrics: 8080
  health: 8081
